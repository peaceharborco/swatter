name = "swatter-swarm-hub"
# Peace Harbor Web. Without this a multi-account login makes wrangler ask, and
# a non-interactive deploy fails. An account id is an identifier, not a secret.
account_id = "7df94febc2ac2d37eb85586011aa7901"
main = "src/index.js"
compatibility_date = "2024-11-01"

# Custom domain (operator-directed 2026-07-03): the Workers platform manages the
# DNS record + cert for this hostname in the peaceharbor.com zone. Zone writes
# are operator-run (Developer rule: zone state goes through terminal-scripts /
# the operator, not agent-run wrangler) — the OPERATOR runs `wrangler deploy`
# with this block active to attach the domain.
routes = [
  { pattern = "swarm.peaceharbor.com", custom_domain = true }
]
# workers.dev stays enabled so the hub has a URL before/without the custom domain.
workers_dev = true

# Every numeric var is parsed by src/config.js and MUST be a positive integer;
# a bad value makes every request a 500 (fail loud) rather than an open gate.
[vars]
COASTGUARD = "1"   # CoastGuard marker (toolbox/coastguard): the fleet audit reads it
SWARM_TTL = "604800"
MAX_ENTRIES = "1000"
FEED_MAX = "50000"
# Live sightings ONE host may hold inside SWARM_TTL. cds1 runs ~8 perms/day
# (~60 live), its largest ever batch was 257; a host at this many is a runaway
# or a compromise, and without a cap it could evict every other host's rows
# from a FEED_MAX-truncated feed. Over quota -> 429, client keeps its cursor.
HOST_MAX = "10000"
# Legacy shared-write-token path RETIRED 2026-07-17 (whole fleet migrated to per-host
# tokens). After this unix ts the hub refuses SWARM_WRITE_TOKEN writes entirely; only
# per-host tokens work. Bump/remove only to re-open the compat window for a NEW
# un-migrated host, then re-close it after that host enrolls.
SWARM_LEGACY_WRITE_UNTIL = "1784309631"

[[d1_databases]]
binding = "DB"
database_name = "swatter-swarm"
# Prod database in the Peace Harbor Web account (created 2026-07-03).
database_id = "0aaa4d75-f275-4b32-bf1e-e0ec775cd860"
migrations_dir = "migrations"

# Per-connecting-IP limiter AND a global limiter (spec §4.2: "connecting IP + a
# global /contribute limit") — the global one bounds a distributed leaked-token
# holder that the per-IP one alone can't.
[[ratelimits]]
name = "CONTRIBUTE_LIMITER"
namespace_id = "1001"
simple = { limit = 120, period = 60 }

[[ratelimits]]
name = "GLOBAL_LIMITER"
namespace_id = "1002"
simple = { limit = 6000, period = 60 }

# /register mints a per-host write token, so throttle enrollment per connecting IP
# (bounds a leaked enroll token). Enrollment is rare, so this is tight.
[[ratelimits]]
name = "REGISTER_LIMITER"
namespace_id = "1003"
simple = { limit = 20, period = 60 }

[triggers]
crons = ["17 4 * * *"]

# Secrets (NOT here): SWARM_WRITE_TOKEN, SWARM_READ_TOKEN, SWARM_ENROLL_TOKEN
# Optional var to hard-retire the shared write token once every host has migrated to
# a per-host token: SWARM_LEGACY_WRITE_UNTIL = "<unix ts>" (after it, legacy writes
# are refused). Leave unset while migrating; set it as the final cutover.

# CoastGuard (peaceharbor/toolbox/coastguard/SPEC.md): caps one invocation
# so a loop or a flood cannot run up the Workers Paid bill. Cloudflare's
# defaults are 30 s CPU / 10,000 subrequests. Worst CPU seen 2026-10-22..29: 14 ms;
# cap is about 3x that (toolbox/coastguard SPEC, 2026-10-29).
[limits]
cpu_ms = 200
subrequests = 1000
