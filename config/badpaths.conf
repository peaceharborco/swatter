# badpaths.conf — known-bad request-path signatures, by severity.
#
# Format:  CATEGORY<TAB-or-spaces>extended-regex
# CATEGORY in {CRITICAL, HIGH, MEDIUM, LOW}. Blank lines and #comments ignored.
# Each request path (lowercased, query stripped) is tested against every regex;
# the highest-severity match wins for that request. A CRITICAL match floors the
# IP's composite score at 90 regardless of other signals.
#
# Regexes are matched case-insensitively by the scorer. Keep them anchored loose
# (no ^/$) so they match anywhere in the path. Edit freely — this is the knob
# operators tune most.

# --- CRITICAL: config/secret exfiltration, RCE primitives -------------------
CRITICAL   /\.env(\.|$|/)
CRITICAL   /\.git/
CRITICAL   /\.aws/
CRITICAL   /\.ssh/
CRITICAL   wp-config\.php(\.(bak|old|save|swp|txt)|~)
CRITICAL   /\.ds_store
CRITICAL   /server-status
CRITICAL   /actuator(/|$)
CRITICAL   eval-stdin\.php
CRITICAL   /vendor/phpunit
CRITICAL   phpunit.*eval

# --- HIGH: auth brute-force, admin tooling, shell drops ---------------------
HIGH       wp-login\.php
HIGH       xmlrpc\.php
HIGH       /phpmyadmin
HIGH       /phpmy admin
HIGH       (^|/)pma(/|$)
HIGH       /adminer
HIGH       /cgi-bin/
HIGH       /boaform
HIGH       /goform
HIGH       \.cgi($|\?)
HIGH       (^|/)shell(\.|/|$)
HIGH       (^|/)cmd(\.|/|$)
HIGH       /hnap1
HIGH       /wp-content/plugins/.*\.php\?

# --- MEDIUM: recon, user enumeration, exchange/owa probes -------------------
MEDIUM     /administrator(/|$)
MEDIUM     /admin\.php
MEDIUM     /wp-json/wp/v2/users
MEDIUM     /autodiscover/autodiscover\.xml
MEDIUM     /owa/
MEDIUM     /ecp/
MEDIUM     setup\.php
MEDIUM     /solr/
MEDIUM     /telescope
MEDIUM     /_ignition/execute-solution
MEDIUM     /wp-content/debug\.log

# --- LOW: generic noise that only matters in volume -------------------------
LOW        /xmlrpc
LOW        /wp-admin/admin-ajax\.php
LOW        \.(asp|aspx|jsp)($|\?)
