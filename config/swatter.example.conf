# swatter.conf — Swatter configuration
#
# Copy to /etc/swatter/swatter.conf (mode 0600, owner root:root) and edit.
# This file is sourced by bash, so it is shell syntax: KEY="value", no spaces
# around the '='. Anything you omit falls back to the built-in default shown.
#
# Override the config path with the SWATTER_CONF environment variable.

# ---- core -----------------------------------------------------------------
# report  = score and log decisions but NEVER touch the firewall (default, safe)
# enforce = actually issue blocks
SWATTER_MODE="report"

# Sliding window the scorer aggregates over, in seconds. Should comfortably
# exceed the cron interval so consecutive runs overlap and nothing is missed.
WINDOW_SECONDS=600

# Ignore any IP with fewer than this many requests in the window. Stops a
# single 404 from a real user ever scoring. Raise on very busy boxes.
MIN_REQS=15

LOG_LEVEL="info"            # debug | info | warn

# ---- log sources (cPanel/Apache defaults; override for plain Apache) -------
DOMLOGS_GLOB="/etc/apache2/logs/domlogs/*"
ACCESS_LOG="/etc/apache2/logs/access_log"
ERROR_LOG="/etc/apache2/logs/error_log"
LFD_LOG="/var/log/lfd.log"             # "" to disable the direct-hit cross-check
SEED_BYTES=5242880                     # 5 MiB tail read the first time a log is seen
MAX_BYTES_PER_FILE=209715200           # 200 MiB hard cap per file per run

# ---- thresholds (0-100 composite score) -----------------------------------
SCORE_WATCH=50             # >= this: log + count, no action
SCORE_TEMP=70             # >= this: temporary block
SCORE_PERM=85             # >= this: long temporary block (perm still needs repeats)

# ---- scoring weights ------------------------------------------------------
# Combined as a weighted average so the composite stays 0-100. W_REPUTATION is
# dropped from BOTH numerator and denominator when no threat-intel is available.
W_RATE=18
W_ERR_RATIO=16
W_ERR_BURST=12
W_FANOUT=12
W_BADPATH=22
W_UA=6
W_POST_FLOOD=8
W_NOVHOST=6
W_REPUTATION=14

# Saturation point for the rate sub-score, in requests/second (rps at which the
# rate signal hits 100).
RATE_SAT=8

# ---- escalation -----------------------------------------------------------
# Space-separated TTL ladder (seconds) for successive temp blocks of one IP.
TTL_LADDER="3600 21600 86400 259200"   # 1h 6h 24h 72h
REPEAT_N=3                              # this many temp blocks...
REPEAT_WINDOW_DAYS=7                    # ...within this many days -> permanent
CRITICAL_TTL_FLOOR=86400                # first-sight TTL floor for CRITICAL bad-paths

# ---- safety rails ---------------------------------------------------------
MAX_BLOCKS_PER_RUN=25                   # circuit breaker, all channels
MAX_CSF_DENIES_PER_RUN=10               # lower cap on the catastrophic CSF channel
ALLOWLIST_MAX_AGE_DAYS=7                # CF range list older than this -> fail closed

# ---- allowlists -----------------------------------------------------------
# Space-separated IPs/CIDRs that must never be blocked (your office, admins).
OPERATOR_IPS=""
# File of never-block IPs/CIDRs, one per line — managed by `swatter allow <ip>`.
# Same semantics as OPERATOR_IPS; use the file for entries added over time and
# the inline list for the handful you want visible in this config.
OPERATOR_ALLOW_FILE="/etc/swatter/allow.cidr"
# Optional file of monitoring CIDRs (UptimeRobot, Pingdom, etc.), one per line.
MONITORING_RANGES_FILE="/etc/swatter/monitoring.cidr"
# Forward-confirm reverse DNS before trusting Googlebot/Bingbot/etc.
VERIFY_GOOD_CRAWLERS="true"
# Cloudflare ranges file, refreshed by `swatter refresh-feeds`.
CLOUDFLARE_IPS_FILE="/etc/swatter/cloudflare.cidr"

# ---- cloudflare plane -----------------------------------------------------
# How to handle offenders that arrived THROUGH Cloudflare (socket = CF edge, so
# they must never be CSF-denied). Pick the posture that matches your setup:
#   auto   = (default) detect whether this box is behind Cloudflare and behave
#            accordingly. Detection runs at install, on `refresh-feeds`, and on
#            `test-config` (never per-scan); it resolves your own vhosts and
#            checks them — plus inbound sockets and the web-server config —
#            against the Cloudflare ranges. A confident "not-behind" reading
#            acts like "off"; anything uncertain stays on the SAFE plane (acts
#            like "direct"/"skip"), so auto never risks misrouting a proxied
#            socket to CSF. Set an explicit mode below to skip detection.
#   direct = Swatter manages the CF plane: zone-scoped IP Access Rules with a
#            TTL, swept on expiry. Needs a token with "Firewall Services: Edit"
#            per account + the maps below. The right choice if Swatter is your
#            main line of defense behind Cloudflare.
#   skip   = YOU manage the Cloudflare plane (your own WAF rules / rate limits /
#            challenges). Swatter still classifies planes and CSF-denies
#            direct-to-origin offenders, but only records via-CF offenders
#            (action "skipped-cf-plane" in the decision log) without acting.
#   off    = this server is NOT behind Cloudflare. Classification is disabled
#            and every offender is CSF-denied directly. Never use "off" to mean
#            "leave my Cloudflare alone" on a proxied server — that's "skip";
#            with "off", proxied visitors (including your own customers) can be
#            misrouted to CSF, which also blocks their mail/cPanel access.
CF_MODE="auto"
# What a Cloudflare-plane rule does. "managed_challenge" is the safe default: a
# false positive (e.g. a customer fat-fingering their own wp-login password)
# just solves a challenge and carries on, while bots fail it. Use "block" only
# if you accept that a scoring false positive locks a human out of that zone.
CF_ACTION="managed_challenge"           # managed_challenge | js_challenge | block
CF_RULE_PREFIX="swatter"                # stamped into the rule notes (ownership + TTL)

# Credentials: a root-only (0600) file of "account<TAB>token" lines, one per CF
# account. Deploy it from your workstation (see install/swatter-deploy-cf-creds.sh)
# rather than committing tokens. Tokens need only "Firewall Services: Edit".
CF_CREDS_FILE="/etc/swatter/cloudflare.creds"

# Domain -> account map: "domain<TAB>account" lines, so Swatter knows which
# account/token owns the zone an attacker hit. Generate from your existing
# cf-domains.conf (skip-profile domains omitted).
CF_DOMAINS_MAP="/etc/swatter/cf-domains.map"

# Direct-to-origin web ports. A confirmed offender with a live TCP connection to
# one of these local ports from a non-Cloudflare IP is bypassing the proxy
# (e.g. POSTing to the origin IP with a forged Host header), so it is CSF-denied
# instead of getting a useless Cloudflare challenge. CF edge sockets are filtered
# out, and the check only runs when the CF range list is fresh. Set to "" to
# disable; an absent key defaults to "80 443".
DIRECT_WEB_PORTS="80 443"

# ---- threat intel ---------------------------------------------------------
# Ordered list. List-based feeds (ipsum, spamhaus) need no API key.
INTEL_PROVIDERS="ipsum spamhaus abuseipdb greynoise projecthoneypot firehol_level1 blocklist_de cins greensnow dshield et_compromised"
# Keyless aggregated list feeds (downloaded by `swatter refresh-feeds`, no key):
#   firehol_level1 (near-zero-FP) · cins · dshield · blocklist_de · et_compromised
#   · greensnow. On by default above. Confidence-tiered: a feed hit only raises an
#   already-suspicious IP's score (intel is consulted only past WATCH).
# Opt-in AbuseIPDB daily blocklist (reuses ABUSEIPDB_KEY; add to INTEL_PROVIDERS):
#   INTEL_PROVIDERS="... abuseipdb_blocklist"
ABUSEIPDB_BLOCKLIST_CONFIDENCE=90
ABUSEIPDB_KEY=""
ABUSEIPDB_DAILY_QUOTA=1000
# GreyNoise Community API (classification + RIOT suppression). Free key from
# greynoise.io. malicious -> raises; RIOT (known business services) -> soft
# allowlist (capped at WATCH); benign -> logged only.
GREYNOISE_KEY=""
GREYNOISE_DAILY_QUOTA=100
# Project Honey Pot http:BL 12-char access key (DNS lookup; needs dig/host).
HTTPBL_KEY=""
INTEL_CACHE_TTL=86400

# ---- hosting-ASN signal ---------------------------------------------------
# A small bounded boost (W_ASN) added ONLY when an offender's behavior is
# already attack-shaped AND its origin ASN is a datacenter/hosting net. Needs a
# DNS client (Team Cymru lookup). A clean visitor from a hosting ASN is never
# penalized. Off by default.
ASN_SIGNAL_ENABLE="false"
HOSTING_ASNS_FILE="/etc/swatter/hosting-asns.txt"
W_ASN=12

# ---- honeypot trap --------------------------------------------------------
# Operator-defined secret paths; a single hit = score 100 = instant permanent
# ban (still plane-classified + allowlist-checked). No default (a published trap
# is useless). See config/honeypot.paths.example; run `swatter honeypot`.
# Patterns MUST be LOWERCASE — request paths are lowercased before matching
# (like badpaths), so an uppercase token silently never matches.
HONEYPOT_PATHS_FILE="/etc/swatter/honeypot.paths"
# If a GreyNoise RIOT verdict and a honeypot hit collide, suppression wins by
# default (never perm-ban a known Google/Slack range off a forged log line).
HONEYPOT_OVERRIDES_SUPPRESS="false"

# ---- low-and-slow persistence ---------------------------------------------
# Escalate an IP that lingers in the WATCH band across many windows (SQLite
# only). Counts distinct PERSIST_BUCKET_SECONDS buckets within the window so the
# overlapping crons aren't double-counted.
PERSIST_ENABLE="true"
PERSIST_N=6
PERSIST_WINDOW_DAYS=3
PERSIST_BUCKET_SECONDS=3600

# ---- prometheus metrics ---------------------------------------------------
# node_exporter textfile-collector path. Written atomically at the end of each
# scan and via `swatter metrics`. Empty disables.
METRICS_FILE="/var/lib/node_exporter/textfile_collector/swatter.prom"

# ---- nightly email report -------------------------------------------------
# `swatter report` emails a digest of the window's offenses + actions, grouped
# by action (perm/temp/exempt/watch), offense type, and bad-path category.
# The installer adds a nightly cron; it stays silent on a quiet window.
REPORT_EMAIL=""                         # recipient ("" disables the report)
REPORT_WINDOW="24h"
REPORT_FROM="swatter@localhost"
REPORT_FROM_NAME="Swatter"
# Delivery method:
#   sendmail = pipe to the local MTA (portable default).
#   sendgrid = POST the SendGrid v3 API. Needs SENDGRID_KEY_FILE.
#   brevo    = POST the Brevo (Sendinblue) v3 API. Needs BREVO_KEY_FILE or
#              BREVO_API_KEY.
# Use sendgrid/brevo when the server's IP isn't an authorized sender for
# REPORT_FROM's domain (so direct-to-MX would fail SPF/DMARC).
REPORT_METHOD="sendmail"
SENDGRID_KEY_FILE=""
BREVO_KEY_FILE=""
BREVO_API_KEY=""

# ---- bundled server error triage (error digest) ---------------------------
# When enabled, the nightly report also includes a "Server errors" section:
# FATAL/ERROR from Apache, PHP-FPM, per-site PHP, and MySQL logs over the same
# window, with known high-volume noise filtered and the rest grouped by
# signature. Swat errors and bad actors in one email.
ERROR_DIGEST_ENABLE="false"
# Read a pre-consolidated log ("[YYYY-MM-DD HH:MM:SS] [LEVEL] [src] msg", UTC) if
# you already aggregate one; leave empty to aggregate live from the globs below.
ERROR_DIGEST_LOG=""
ERROR_FPM_GLOB="/opt/cpanel/ea-php8*/root/usr/var/log/php-fpm/error.log"
ERROR_MYSQL_GLOB="/var/lib/mysql/*.err"
ERROR_PHP_HOME_GLOB="/home"
# Extended-regex of message substrings filtered out as known noise (edit freely).
ERROR_NOISE="prefetch request body failed|error reading status line from remote server|invalid URI path|Invalid method in request|no compatible SSL setup for policy|client denied by server configuration|Error dispatching request to"

# ---- storage / paths ------------------------------------------------------
STORE="sqlite"                          # sqlite | flatfile
STATE_DIR="/var/lib/swatter"
LOG_DIR="/var/log/swatter"
NOTIFY_EMAIL=""                         # circuit-breaker / fail-closed alerts ("" = none)

# ---- firewall backend -----------------------------------------------------
# csf   = ConfigServer Security Firewall (default; existing behavior)
# ipset = kernel ipset + iptables DROP (lower latency; needs `swatter setup-ipset`)
# The two backends can coexist: CSF manages its own deny list; ipset handles
# direct-backend blocks. After a reboot, restore the ipset with IPSET_SAVE_FILE.
DIRECT_BACKEND="csf"
IPSET_SAVE_FILE="/etc/swatter/ipset.save"   # written by setup-ipset; sourced at boot

# ---- origin lock (inline Cloudflare-only L3 lock) -------------------------
# Optional, OFF by default. An inline iptables/ip6tables rule that lets ONLY
# Cloudflare edge ranges reach the web ports, dropping direct-to-origin
# Cloudflare-bypass traffic at the socket. This is the STRUCTURAL complement to
# the reactive direct-vs-proxied classifier: the classifier scores a bypass
# offender after it appears in the logs; the lock closes the door first. Apply
# and manage it with `swatter origin-lock {apply|status|preflight|disable}`.
# The Cloudflare ranges come from CLOUDFLARE_IPS_FILE above (no new list).
#
# Three-state ladder — climb it deliberately:
#   off  = (default) install no restriction at all.
#   log  = ACCEPT Cloudflare edges -> web ports, then rate-limited LOG (prefix
#          "ORIGIN-LOCK: ") of everything else. No drop. Validate here first.
#   drop = same ACCEPT + LOG, then DROP the remainder.
# ALWAYS run `log` first, read the would-be-drops with `swatter origin-lock
# preflight`, and allowlist every legit source (monitoring, grey-cloud vhosts,
# health checks) BEFORE setting `drop`. `drop` is guarded: `apply` runs preflight
# and requires interactive confirmation (or --yes/--force) before installing it.
# An empty/missing/too-small CLOUDFLARE_IPS_FILE => no rules installed (fail-open).
ORIGIN_LOCK="off"                       # off | log | drop
# Web ports the lock governs (comma-separated).
ORIGIN_LOCK_PORTS="80,443"
# Allow the whole /.well-known/ prefix on :80 from any source so HTTP domain-
# validation keeps working behind the lock: ACME HTTP-01 AND cPanel/Sectigo
# AutoSSL DCV (pki-validation, cpanel-dcv). Narrowing to just acme-challenge would
# silently break cPanel cert renewals. Soft-fails with a warning if xt_string is
# unavailable — disable this or use DNS-01 then. (/.well-known/ is public; not
# TLS-ALPN-01.)
ORIGIN_LOCK_ALLOW_ACME="true"
# ipset basename for the Cloudflare-edge sets: <name>4 (v4) / <name>6 (v6).
# Independent of the swatter4/swatter6 offender sets used by DIRECT_BACKEND.
ORIGIN_LOCK_SET="cf_origin"

# ---- real-time alerting (all channels optional) ---------------------------
# Swatter runs fine with no alerting config. Add only the channels you want.
# Keys go in root-only (0600) files on the server — never committed to the repo.

# SendGrid transactional email alert (needs curl + jq; set REPORT_METHOD for the
# nightly digest; this is for threshold-crossing real-time pings).
ALERT_EMAIL=""                           # recipient address; "" disables email alerts
# SENDGRID_KEY_FILE is shared with the report mailer — set it once in the
# REPORT_METHOD/SENDGRID_KEY_FILE block above.

# Twilio SMS alert. Get credentials at console.twilio.com (free trial available).
ALERT_SMS_TO=""                          # E.164 destination, e.g. +12065551234
TWILIO_SID=""                            # Account SID from the Twilio console
TWILIO_FROM=""                           # Twilio number, e.g. +15005550006
TWILIO_TOKEN_FILE=""                     # root-only file containing the Auth Token

# Generic webhook (Slack incoming webhook, Discord, PagerDuty, etc.).
# Sign up at slack.com/apps → Incoming Webhooks, or discord.com → Integrations.
ALERT_WEBHOOK_URL=""                     # full HTTPS URL; "" disables
ALERT_WEBHOOK_FORMAT="auto"             # auto | slack | discord | raw-json

# Suppress repeat alerts for the same IP for this many seconds.
ALERT_REPEAT_TTL=21600                  # 6 hours

# ---- outbound AbuseIPDB reporting (opt-in) --------------------------------
# When true, each permanent ban is reported back to AbuseIPDB (reuses
# ABUSEIPDB_KEY; set that above). Off by default — opt in deliberately.
ABUSEIPDB_REPORT="false"
ABUSEIPDB_REPORT_TTL=900               # dedupe window: don't re-report same IP within N seconds
