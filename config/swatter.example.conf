# swatter.conf — Swatter configuration
#
# Copy to /etc/swatter/swatter.conf (mode 0600, owner root:root) and edit.
# This file is sourced by bash, so it is shell syntax: KEY="value", no spaces
# around the '='. Anything you omit falls back to the built-in default shown.
#
# Override the config path with the SWATTER_CONF environment variable.

# ---- core -----------------------------------------------------------------
# report  = score and log decisions but NEVER touch the firewall (default, safe)
# enforce = actually issue blocks
SWATTER_MODE="report"

# Sliding window the scorer aggregates over, in seconds. Should comfortably
# exceed the cron interval so consecutive runs overlap and nothing is missed.
WINDOW_SECONDS=600

# Ignore any IP with fewer than this many requests in the window. Stops a
# single 404 from a real user ever scoring. Raise on very busy boxes.
MIN_REQS=15

LOG_LEVEL="info"            # debug | info | warn

# ---- log sources (cPanel/Apache defaults; override for plain Apache) -------
DOMLOGS_GLOB="/etc/apache2/logs/domlogs/*"
ACCESS_LOG="/etc/apache2/logs/access_log"
ERROR_LOG="/etc/apache2/logs/error_log"
LFD_LOG="/var/log/lfd.log"             # "" to disable the direct-hit cross-check
SEED_BYTES=5242880                     # 5 MiB tail read the first time a log is seen
MAX_BYTES_PER_FILE=209715200           # 200 MiB hard cap per file per run

# ---- thresholds (0-100 composite score) -----------------------------------
# perm has no score threshold: it comes from repeats (REPEAT_N temp blocks in
# REPEAT_WINDOW_DAYS), honeypot hits, or hard intel — never a single hot score.
SCORE_WATCH=50             # >= this: log + count, no action
SCORE_TEMP=70              # >= this: temporary block

# ---- scoring weights ------------------------------------------------------
# Combined as a weighted average so the composite stays 0-100. W_REPUTATION is
# dropped from BOTH numerator and denominator when no threat-intel is available.
W_RATE=18
W_ERR_RATIO=16
W_ERR_BURST=12
W_FANOUT=12
W_BADPATH=22
W_UA=6
W_POST_FLOOD=8
W_NOVHOST=6
W_REPUTATION=14

# Saturation point for the rate sub-score, in requests/second (rps at which the
# rate signal hits 100).
RATE_SAT=8

# ---- escalation -----------------------------------------------------------
# Space-separated TTL ladder (seconds) for successive temp blocks of one IP.
TTL_LADDER="3600 21600 86400 259200"   # 1h 6h 24h 72h
REPEAT_N=3                              # this many temp blocks...
REPEAT_WINDOW_DAYS=7                    # ...within this many days -> permanent
                                        # Counting excludes report-mode (dry-run)
                                        # blocks, and resets at a manual
                                        # `swatter unblock` — an operator
                                        # correction clears the ladder.
REPEAT_N_CRITICAL_SINGLE=4              # ...but this many when EVERY in-window
                                        # temp was a single CRITICAL probe (one
                                        # /.env hit is already a temp, so a bare
                                        # REPEAT_N would perm on 3 single probes)
                                        # This knob only RAISES the bar: a value
                                        # below REPEAT_N is clamped up to it.
                                        # sqlite store only — on STORE=flatfile
                                        # the gate is inert (it matches the
                                        # ledger's rule= stamp) and escalation
                                        # falls back to REPEAT_N, with a warning.
CRITICAL_TTL_FLOOR=86400                # first-sight TTL floor for CRITICAL bad-paths
# Abort lever for the recidivism ladder (temp -> permanent escalation).
# "true" (default) = ladder active, the behaviour every version since v1.0.0
# has had. Set to "false" to STOP new ladder perms during an incident; see
# docs/RUNBOOK.md, because disarming does NOT stop honeypot or hard-intel
# perms, and does not lift bans already placed.
#REPEAT_ENABLE="true"

# ---- safety rails ---------------------------------------------------------
MAX_BLOCKS_PER_RUN=25                   # circuit breaker, all channels
MAX_CSF_DENIES_PER_RUN=10               # lower cap on the catastrophic CSF channel
ALLOWLIST_MAX_AGE_DAYS=7                # CF range list older than this -> fail closed
# Perm-rate tripwire — an ALERT floor. Keep it tight enough to fire.
# It is NOT an abort threshold: the decision to abort compares the observed rate
# against the band you measured for THIS host (docs/RUNBOOK.md), by human
# judgement. Never raise these to stop an alarm being noisy — that raises the
# floor a genuine wave has to clear, and the nightly digest will not catch it
# (it grades blocks GREEN by design).
#PERM_RATE_ALERT_PER_RUN="5"
#PERM_RATE_ALERT_PER_DAY="15"

# ---- durable failed-block retry (sqlite store only) -----------------------
# A block that hits a TRANSIENT backend error (CF API 5xx/timeout, csf/ipset
# command failure) is queued and re-driven on later scans, independent of whether
# the offender reappears in the log — without this a single-burst offender's block
# is silently, permanently dropped (ingest reads each log line exactly once). An
# intent that never lands self-reaps after MAX_ATTEMPTS re-tries or MAX_AGE_HOURS,
# whichever first; the give-up is logged and surfaces as `retry-exhausted` in the
# nightly digest. Retries count against MAX_BLOCKS_PER_RUN.
PENDING_RETRY_MAX_ATTEMPTS=12           # ~1h of retries on a */5 cron
PENDING_RETRY_MAX_AGE_HOURS=24          # hard ceiling before giving up
PENDING_RETRY_MAX_PER_RUN=10            # cap retries/scan so a big queue can't
                                        # starve fresh offenders (< MAX_BLOCKS_PER_RUN)

# ---- dual-plane hard-intel blocking ---------------------------------------
# An IP whose threat-intel reputation is >= INTEL_HARDBLOCK_MIN (Spamhaus DROP
# and AbuseIPDB both emit 100 — never a legitimate visitor) gets a fresh PERM
# block on BOTH planes: the Cloudflare edge (proxied traffic) AND CSF (direct-
# to-origin on any port, incl. cPanel service ports like webmail :2095). This
# costs up to 2 blocks toward MAX_BLOCKS_PER_RUN and, for the CSF leg, one toward
# MAX_CSF_DENIES_PER_RUN. never_block + fail-closed still gate the CSF leg, so a
# Cloudflare edge range can never be CSF-denied; stale ranges degrade it to
# CF-only. Set false to keep single-plane blocking.
DUAL_PLANE_HARD_INTEL=true
INTEL_HARDBLOCK_MIN=100

# ---- allowlists -----------------------------------------------------------
# Space-separated IPs/CIDRs that must never be blocked (your office, admins).
OPERATOR_IPS=""
# File of never-block IPs/CIDRs, one per line — managed by `swatter allow <ip>`.
# Same semantics as OPERATOR_IPS; use the file for entries added over time and
# the inline list for the handful you want visible in this config.
OPERATOR_ALLOW_FILE="/etc/swatter/allow.cidr"
# Optional file of monitoring CIDRs (UptimeRobot, Pingdom, etc.), one per line.
MONITORING_RANGES_FILE="/etc/swatter/monitoring.cidr"
# Forward-confirm reverse DNS before trusting Googlebot/Bingbot/etc.
VERIFY_GOOD_CRAWLERS="true"
# Cloudflare ranges file, refreshed by `swatter refresh-feeds`.
CLOUDFLARE_IPS_FILE="/etc/swatter/cloudflare.cidr"

# ---- cloudflare plane -----------------------------------------------------
# How to handle offenders that arrived THROUGH Cloudflare (socket = CF edge, so
# they must never be CSF-denied). Pick the posture that matches your setup:
#   auto   = (default) detect whether this box is behind Cloudflare and behave
#            accordingly. Detection runs at install, on `refresh-feeds`, and on
#            `test-config` (never per-scan); it resolves your own vhosts and
#            checks them — plus inbound sockets and the web-server config —
#            against the Cloudflare ranges. A confident "not-behind" reading
#            acts like "off"; anything uncertain stays on the SAFE plane (acts
#            like "direct"/"skip"), so auto never risks misrouting a proxied
#            socket to CSF. Set an explicit mode below to skip detection.
#   direct = Swatter manages the CF plane: IP Access Rules with a TTL, swept on
#            expiry, at the scope set by CF_SCOPE below (zone or account). Needs
#            a token per account + the maps below. The right choice if Swatter is
#            your main line of defense behind Cloudflare.
#   skip   = YOU manage the Cloudflare plane (your own WAF rules / rate limits /
#            challenges). Swatter still classifies planes and CSF-denies
#            direct-to-origin offenders, but only records via-CF offenders
#            (action "skipped-cf-plane" in the decision log) without acting.
#   off    = this server is NOT behind Cloudflare. Classification is disabled
#            and every offender is CSF-denied directly. Never use "off" to mean
#            "leave my Cloudflare alone" on a proxied server — that's "skip";
#            with "off", proxied visitors (including your own customers) can be
#            misrouted to CSF, which also blocks their mail/cPanel access.
CF_MODE="auto"
# What a Cloudflare-plane rule does. "managed_challenge" is the safe default: a
# false positive (e.g. a customer fat-fingering their own wp-login password)
# just solves a challenge and carries on, while bots fail it. Use "block" only
# if you accept that a scoring false positive locks a human out of that zone.
CF_ACTION="managed_challenge"           # managed_challenge | js_challenge | block

# Where a Cloudflare-plane rule lands:
#   zone    = (default) a rule on the single zone the attacker hit. Smallest
#             blast radius; needs only a zone-scoped "Firewall Services: Edit"
#             token. Caveat: a scanner that rotates target vhosts is only
#             challenged on the FIRST zone it touched, then roams free across
#             every other zone on the account — because Swatter's per-IP ledger
#             marks it "handled" after the first block.
#   account = a rule on EVERY account in CF_CREDS_FILE, so one block blankets
#             every zone on every account and the scope matches the ledger. No
#             target vhost is required (works for raw-IP / no-Host offenders).
#             Recommended when Swatter is your main line of defense. Needs a
#             token with "Account Firewall Access Rules: Edit" (account-scoped) —
#             broader than the zone token. A token lacking account scope makes
#             account blocks FAIL and retry each run (logged loudly with a scope
#             hint) so the misconfig surfaces instead of silently leaving
#             offenders unblocked; only an empty creds file is "skipped-config".
CF_SCOPE="zone"                         # zone | account
CF_RULE_PREFIX="swatter"                # stamped into the rule notes (ownership + TTL)

# Credentials: a root-only (0600) file of "account<TAB>token" lines, one per CF
# account. Deploy it from your workstation (see install/swatter-deploy-cf-creds.sh)
# rather than committing tokens. CF_SCOPE=zone tokens need only "Firewall
# Services: Edit"; CF_SCOPE=account tokens additionally need "Account Firewall
# Access Rules: Edit".
CF_CREDS_FILE="/etc/swatter/cloudflare.creds"
CF_ACCOUNT_CACHE_TTL=604800             # re-resolve each token's accounts after N sec
                                        # (7d) even if the creds file didn't change

# Domain -> account map: "domain<TAB>account" lines, so Swatter knows which
# account/token owns the zone an attacker hit. Generate from your existing
# cf-domains.conf (skip-profile domains omitted).
CF_DOMAINS_MAP="/etc/swatter/cf-domains.map"

# Direct-to-origin web ports. A confirmed offender with a live TCP connection to
# one of these local ports from a non-Cloudflare IP is bypassing the proxy
# (e.g. POSTing to the origin IP with a forged Host header), so it is CSF-denied
# instead of getting a useless Cloudflare challenge. CF edge sockets are filtered
# out, and the check only runs when the CF range list is fresh. Set to "" to
# disable; an absent key defaults to "80 443".
DIRECT_WEB_PORTS="80 443"

# ---- threat intel ---------------------------------------------------------
# Ordered list. List-based feeds (ipsum, spamhaus) need no API key.
INTEL_PROVIDERS="ipsum spamhaus abuseipdb greynoise projecthoneypot firehol_level1 blocklist_de cins greensnow dshield et_compromised"
# Poison guard: reject a downloaded CIDR feed whose entries are broader than these
# prefixes (a MITM'd 0.0.0.0/0 would otherwise score every visitor 100). Legit DROP
# netblocks are /9 or smaller, so the defaults only catch abuse; last-good is kept.
INTEL_FEED_MIN_PREFIX4=8
INTEL_FEED_MIN_PREFIX6=16
# Keyless aggregated list feeds (downloaded by `swatter refresh-feeds`, no key):
#   firehol_level1 (near-zero-FP) · cins · dshield · blocklist_de · et_compromised
#   · greensnow. On by default above. Confidence-tiered: a feed hit only raises an
#   already-suspicious IP's score (intel is consulted only past WATCH).
# Opt-in AbuseIPDB daily blocklist (reuses ABUSEIPDB_KEY; add to INTEL_PROVIDERS):
#   INTEL_PROVIDERS="... abuseipdb_blocklist"
ABUSEIPDB_BLOCKLIST_CONFIDENCE=90
ABUSEIPDB_KEY=""
ABUSEIPDB_DAILY_QUOTA=1000
# GreyNoise Community API (classification + RIOT suppression). Free key from
# greynoise.io. malicious -> raises; RIOT (known business services) -> soft
# allowlist (capped at WATCH); benign -> logged only.
GREYNOISE_KEY=""
GREYNOISE_DAILY_QUOTA=100
# Project Honey Pot http:BL 12-char access key (DNS lookup; needs dig/host).
HTTPBL_KEY=""
# Prefer keeping API keys OUT of this 0600 file: point these at 0400 key files (like
# SENDGRID_KEY_FILE / the Twilio + swarm tokens). If set + readable, the file wins
# over the inline value above; the key stays a shell var, never exported.
# ABUSEIPDB_KEY_FILE="/etc/swatter/abuseipdb.key"
# GREYNOISE_KEY_FILE="/etc/swatter/greynoise.key"
# HTTPBL_KEY_FILE="/etc/swatter/httpbl.key"
INTEL_CACHE_TTL=86400

# ---- hosting-ASN signal ---------------------------------------------------
# A small bounded boost (W_ASN) added ONLY when an offender's behavior is
# already attack-shaped AND its origin ASN is a datacenter/hosting net. Needs a
# DNS client (Team Cymru lookup). A clean visitor from a hosting ASN is never
# penalized. Off by default.
ASN_SIGNAL_ENABLE="false"
HOSTING_ASNS_FILE="/etc/swatter/hosting-asns.txt"
W_ASN=12

# ---- shared consumer-VPN egress -------------------------------------------
# Addresses used by many people at once (Cloudflare WARP, consumer VPN exits).
# A match caps enforcement at a ladder-max TEMP: the IP is still banned, it just
# cannot be banned permanently. A capped perm is never published to the swarm or
# reported to AbuseIPDB, whatever ABUSEIPDB_REPORT_MIN_ACTION says. An ordinary
# first-offense TEMP on such an address is NOT a capped perm and still follows
# that setting (default "perm" = temps are never reported). NOT an allowlist.
# Both files below are load-bearing: without the .cidr file the policy is on and
# caps nothing. install/install.sh creates them; a file-by-file deploy does not.
# Review with: swatter shared-egress-audit   |   verify with: swatter test-config
#SHARED_EGRESS_ENABLE="true"
#SHARED_EGRESS_CIDR_FILE="/etc/swatter/shared-egress.cidr"
#SHARED_EGRESS_ASNS_FILE="/etc/swatter/shared-egress-asns.txt"
# Width floor for the CIDR file. A line broader than this is rejected and turns
# the whole CIDR arm off — a wide entry would silently stop ALL permanent bans.
#SHARED_EGRESS_MIN_PREFIX4="16"
#SHARED_EGRESS_MIN_PREFIX6="32"
# Safety limit on `shared-egress-audit --fix`; above this it demands --force.
#SHARED_EGRESS_AUDIT_MAX="25"

# ---- honeypot trap --------------------------------------------------------
# Operator-defined secret paths; a single hit = score 100 = instant permanent
# ban (still plane-classified + allowlist-checked). No default (a published trap
# is useless). See config/honeypot.paths.example; run `swatter honeypot`.
# Patterns MUST be LOWERCASE — request paths are lowercased before matching
# (like badpaths), so an uppercase token silently never matches.
HONEYPOT_PATHS_FILE="/etc/swatter/honeypot.paths"
# If a GreyNoise RIOT verdict and a honeypot hit collide, suppression wins by
# default (never perm-ban a known Google/Slack range off a forged log line).
HONEYPOT_OVERRIDES_SUPPRESS="false"

# ---- low-and-slow persistence ---------------------------------------------
# Escalate an IP that lingers in the WATCH band across many windows (SQLite
# only). Counts distinct PERSIST_BUCKET_SECONDS buckets within the window so the
# overlapping crons aren't double-counted.
PERSIST_ENABLE="true"
PERSIST_N=6
PERSIST_WINDOW_DAYS=3
PERSIST_BUCKET_SECONDS=3600

# ---- prometheus metrics ---------------------------------------------------
# node_exporter textfile-collector path. Written atomically at the end of each
# scan and via `swatter metrics`. Empty disables.
METRICS_FILE="/var/lib/node_exporter/textfile_collector/swatter.prom"

# ---- nightly email report -------------------------------------------------
# `swatter report` emails a digest of the window's offenses + actions, grouped
# by action, offense type, and bad-path category. Decision-log (decisions.jsonl)
# actions, and how the digest treats each:
#   perm / temp           enforced blocks — COUNTED in the digest block tallies
#   exempt                scored high but on the allowlist (review item)
#   watch                 over the watch band, logged only (no block)
#   noop-perm             already permanently blocked; nothing re-done
#   skipped-cap           a per-run block cap was hit (deliberate throttle)
#   skipped-config        deterministic config gap: vhost not in CF_DOMAINS_MAP or
#                         no token — fix the map/creds (won't self-resolve)
#   skipped-novhost       no nameable target vhost in THIS window (raw-IP/no-Host);
#                         data-dependent, may resolve next scan — NOT a misconfig
#   skipped-cf-plane      VIA_CF offender left to the edge (CF_MODE=skip/auto-no-creds)
#   skipped-failclosed    CSF deny suppressed because the CF range list was stale
#   failed                a block was attempted but the backend errored (NOT counted)
# Failure vs skip axis: operator CONFIG/credentials/zone-map gaps surface as
# skipped-config (expected, quiet, per-offender); broken HOST TOOLING (missing
# jq/curl), zone-lookup, and live API errors surface as failed (loud — fix the
# install / investigate the API). Only perm/temp count toward the block tallies.
# The installer adds a nightly cron; it stays silent on a quiet window.
# With sendgrid/brevo you normally only set REPORT_EMAIL + REPORT_FROM (plus the
# key file below) — REPORT_FROM_NAME and the subject already ship sensible defaults.
REPORT_EMAIL=""                         # recipient ("" disables the report)
REPORT_WINDOW="24h"
REPORT_FROM="swatter@localhost"         # sender address (verified in your ESP)
# From-header display name. Defaults to "Swatter [<this host's FQDN>]" so each
# server self-labels; override only if you want a fixed name. The subject line is
# computed per-report and is not configurable. Use brackets, NOT parentheses:
# RFC 5322 treats "(...)" in a header as a comment that mail clients strip, so
# "Swatter (host)" would show as just "Swatter".
REPORT_FROM_NAME="Swatter [$(hostname -f 2>/dev/null || hostname)]"
# Delivery method:
#   sendmail = pipe to the local MTA (portable default).
#   sendgrid = POST the SendGrid v3 API. Needs SENDGRID_KEY_FILE. Free: 100/day.
#   brevo    = POST the Brevo (Sendinblue) v3 API. Needs BREVO_KEY_FILE or
#              BREVO_API_KEY. Free: 300/day.
# Use sendgrid/brevo when the server's IP isn't an authorized sender for
# REPORT_FROM's domain (so direct-to-MX would fail SPF/DMARC).
REPORT_METHOD="sendmail"
SENDGRID_KEY_FILE=""
BREVO_KEY_FILE=""
BREVO_API_KEY=""
# Header logo on the HTML report. Blank = the default Peace Harbor Studios
# lockup. Point these at your own company logo to white-label the header
# (https URL, rendered 360px wide and scaled down on narrow clients). The
# footer branding is part of the project and is not configurable.
REPORT_LOGO_URL=""                      # e.g. "https://example.com/logo.png"
REPORT_LOGO_ALT=""                      # e.g. "Acme Corp"

# ---- report status thresholds (traffic light) -----------------------------
# The nightly report status is GREEN / YELLOW / RED. RED = any GENUINE fatal
# error — fatals filed scanner-induced by the errors plane (they match
# ERROR_FATAL_SCANNER, stay under ERROR_FATAL_SCANNER_REPEATS in depth AND under
# ERROR_FATAL_FANOUT_ACCOUNTS in breadth, all below) don't trip it.
# YELLOW = elevated non-fatal error volume; these two knobs set where it starts
# and where the wording escalates from "investigate" to "act now". Blocks and
# origin-lock hits never leave GREEN (that's Swatter working). NOTE: these only
# take effect when ERROR_DIGEST_ENABLE=true (below) — without it, no error
# counts are computed and the status is driven by blocks alone (GREEN).
REPORT_GRADE_C_ERRORS=100               # >= this many non-fatal errors -> YELLOW (investigate)
REPORT_GRADE_D_ERRORS=300               # >= this many -> YELLOW with "act now" wording (error flood)

# ---- SMS alert on a RED status (Twilio) -----------------------------------
# A SECOND channel: when the nightly report status is RED (a genuine fatal), also
# text you. The email still sends regardless. OFF by default; fail-soft (never
# blocks the report). `swatter report --test` sends a [TEST] SMS so you can
# verify setup.
ALERT_SMS_METHOD=""                # "twilio" to enable; "" = off
ALERT_SMS_GRADES="RED"             # statuses that trigger an SMS (GREEN/YELLOW/RED)
ALERT_SMS_TO=""                    # your number, E.164 (+15551234567)
ALERT_SMS_DEDUP_HOURS=6            # don't re-text the same status within N hours
TWILIO_SID=""                      # Twilio Account SID
TWILIO_TOKEN_FILE=""               # file holding the Twilio auth token (chmod 0400)
TWILIO_FROM=""                     # your Twilio sender number, E.164

# ---- bundled server error triage (error digest) ---------------------------
# When enabled, the nightly report also includes a "Server errors" section:
# FATAL/ERROR from Apache, PHP-FPM, per-site PHP, and MySQL logs over the same
# window, with known high-volume noise filtered and the rest grouped by
# signature. Swat errors and bad actors in one email.
ERROR_DIGEST_ENABLE="false"
# Read a pre-consolidated log ("[YYYY-MM-DD HH:MM:SS] [LEVEL] [src] msg", UTC) if
# you already aggregate one; leave empty to aggregate live from the globs below.
ERROR_DIGEST_LOG=""

# ---- origin-lock digest plane (nightly report) ----------------------------
# When the nightly report runs and the window has any origin-lock drops, a
# "Origin-Lock" section is included: total direct-to-origin hits dropped, source
# IPs, the 80/443 split, and the top sources tagged attacker/legit. "auto" shows
# it only when there are hits; "on" always; "off" never.
ORIGIN_LOCK_DIGEST="auto"
# Syslog source for ORIGIN-LOCK: lines. Empty = /var/log/messages* (RHEL/cPanel).
# Debian/Ubuntu: set to /var/log/syslog.
ORIGIN_LOCK_LOG=""

# ---- nightly report schedule ----------------------------------------------
# install.sh writes /etc/cron.d/swatter from these. REPORT_CRON is "minute hour".
# Your server clock is almost certainly UTC. To get the report at 4am in YOUR
# timezone, set REPORT_CRON_TZ to your IANA zone, e.g. America/Los_Angeles —
# cron then delivers at that exact wall-clock hour, following DST. Empty = UTC.
REPORT_CRON="0 4"
REPORT_CRON_TZ=""

ERROR_FPM_GLOB="/opt/cpanel/ea-php8*/root/usr/var/log/php-fpm/error.log"
ERROR_MYSQL_GLOB="/var/lib/mysql/*.err"
ERROR_PHP_HOME_GLOB="/home"
# Extended-regex of message substrings filtered out as known noise (edit freely).
ERROR_NOISE="prefetch request body failed|error reading status line from remote server|invalid URI path|Invalid method in request|no compatible SSL setup for policy|client denied by server configuration|Error dispatching request to"

# Scanner-fatal classifier: a fatal matching this extended regex that repeats
# fewer than REPEATS times in the window is scanner-induced — a bot executing a
# PHP file directly, outside the app bootstrap (e.g. wp-settings.php hit head-on
# throws `Undefined constant "ABSPATH"`) — and does NOT trip the RED status.
# Real breakage of the same shape (broken plugin, half-deployed theme) repeats
# on every page view and crosses the threshold, so it still goes RED.
# TRADE-OFF: a genuine one-off fatal of this shape on a near-zero-traffic site
# rides below the threshold until it repeats — unless it also spans accounts, which
# ERROR_FATAL_FANOUT_ACCOUNTS (below) catches. The pattern alone never decides the
# class: depth and breadth both have to stay under their thresholds. Set REPEATS to
# 0 or 1 to disable the classifier (every matching fatal counts as genuine). Empty
# or invalid regex falls back to the built-in default — never to "everything is a
# scanner".
ERROR_FATAL_SCANNER='PHP Fatal error: Uncaught Error: (Call to undefined function|Undefined constant)'
ERROR_FATAL_SCANNER_REPEATS=3

# How many DISTINCT ACCOUNTS must share one fatal signature before it stops being
# filed as scanner-induced. ERROR_FATAL_SCANNER_REPEATS above counts repeats of a
# single signature (depth); this counts how far one signature has spread (breadth).
# Breadth matters because the signature keeps each account's own /home/<acct> path,
# so a single shared bug across N accounts looks like N unrelated one-offs and every
# one of them slips under the depth gate — a fleet-wide outage graded green.
#
# A cross-account cluster is reported whether a bot swept your sites or a deploy
# broke them: those are indistinguishable in the error log, so the digest surfaces
# it and lets you judge. Expect some REDs that used to be GREEN; that is this
# working.
#
# Tune per host. Measured on the reference host, bot sweeps reached 3 accounts and
# a genuine fleet bug reached 4, hence 4. If routine sweeping on your box is wider,
# raise this — it does not weaken single-account detection, which REPEATS still
# governs. Invalid values fall back to 4 with a warning; 0 turns the breadth gate
# off; 1 makes every matching fatal count genuine.
ERROR_FATAL_FANOUT_ACCOUNTS=4

# ---- outage corroboration (who actually received the failures) --------------
# A RED tells you fatals happened. It cannot tell you whether a human was waiting
# on one, because a PHP error log records that a request crashed and never who
# asked. With this on, the errors plane reads the affected accounts' own access
# logs for the window that signature occupied and splits the failed responses
# three ways: an outside client with a real user agent, the server talking to
# itself (wp-cron, a Jetpack/REST loopback), or a bot.
#
# Only a visitor-shaped answer escalates, and it escalates the LAMP only — 🔥
# with the word "Outage" instead of 🔴 "Act Now". The status is RED either way,
# the SMS fires either way, and no answer here can ever make a window quieter:
# a failed lookup, an unreadable log or a rotated-away window all leave the
# grade exactly where the thresholds put it.
#
# MAX_SPAN is the honesty knob. One signature can recur across a whole day; on
# the reference host real clusters spanned 6-19 hours. Correlating a 19-hour
# window against "were there 5xx" is meaningless — any ordinary day has a few —
# so above this many seconds the digest reports the span and declines to
# correlate at all rather than guessing.
ERROR_CORROBORATE_ENABLE=true
ERROR_CORROBORATE_MAX_SPAN=3600

# Veto on the classifier above: a fatal matching this extended regex can never be
# scanner-induced, no matter how few times it repeats. The classifier's premise
# is a bot executing a PHP file over HTTP; a frame naming a local CLI entrypoint
# (`phar:///usr/local/bin/wp-cli.phar/...`) disproves that outright — the fatal
# came from tooling run on the box. Without the veto, a broken maintenance script
# is filed as bot noise: it hides your own breakage AND inflates the scanner
# count. Matching fatals go to the genuine count, so they can trip RED — that is
# the point. Set to '^$' to disable the veto entirely (a fatal signature is never
# empty, so it never matches).
#
# Note it does NOT match a bare `phar://`. The veto's claim is "this ran on the
# box", and only a known local entrypoint proves that — a bot can induce a
# phar:// frame via deserialization probes, so that fatal is left to the
# classifier's own terms instead of being pulled out of the scanner class by a
# path prefix. Concretely: under the default knobs a one-off bot phar:// fatal
# is counted SCANNER, not genuine. If you want remote phar:// fatals to trip
# RED, that is a change to ERROR_FATAL_SCANNER, not to this veto.
#
# The veto only ever moves fatals TOWARD genuine — it cannot hide an outage.
# One consequence worth knowing: the `wp-cli\.phar` alternative is an unanchored
# substring, so an attacker who can drop a file named wp-cli.phar under a
# docroot AND trigger a matching fatal can force it into the genuine count and
# cry wolf on RED. Noisy, never quiet; tighten the pattern if that bothers you.
#
# Patterns here are validated against grep -E AND awk, because awk is what
# applies them and the dialects disagree ('$^' and '(?i)x' are grep-legal,
# awk-illegal). A pattern that fails either falls back to the built-in default
# above — NOT to '^$'. That is the middle of three behaviours (empty would make
# every fatal genuine; '^$' would veto nothing), chosen so a typo keeps shipping
# behaviour instead of silently swinging the digest to an extreme.
ERROR_FATAL_SCANNER_EXCLUDE='phar:///usr/local/bin/|/usr/local/bin/wp-cli|wp-cli\.phar'

# ---- storage / paths ------------------------------------------------------
STORE="sqlite"                          # sqlite | flatfile
STATE_DIR="/var/lib/swatter"
LOG_DIR="/var/log/swatter"
NOTIFY_EMAIL=""                         # circuit-breaker / fail-closed alerts ("" = none)

# ---- firewall backend -----------------------------------------------------
# csf   = ConfigServer Security Firewall (default; existing behavior)
# ipset = kernel ipset + iptables DROP (lower latency; needs `swatter setup-ipset`)
# The two backends can coexist: CSF manages its own deny list; ipset handles
# direct-backend blocks. After a reboot, restore the ipset with IPSET_SAVE_FILE.
DIRECT_BACKEND="csf"
IPSET_SAVE_FILE="/etc/swatter/ipset.save"   # written by setup-ipset; sourced at boot

# ---- origin lock (inline Cloudflare-only L3 lock) -------------------------
# Optional, OFF by default. An inline iptables/ip6tables rule that lets ONLY
# Cloudflare edge ranges reach the web ports, dropping direct-to-origin
# Cloudflare-bypass traffic at the socket. This is the STRUCTURAL complement to
# the reactive direct-vs-proxied classifier: the classifier scores a bypass
# offender after it appears in the logs; the lock closes the door first. Apply
# and manage it with `swatter origin-lock {apply|status|preflight|disable}`.
# The Cloudflare ranges come from CLOUDFLARE_IPS_FILE above (no new list).
#
# Three-state ladder — climb it deliberately:
#   off  = (default) install no restriction at all.
#   log  = ACCEPT Cloudflare edges -> web ports, then rate-limited LOG (prefix
#          "ORIGIN-LOCK: ") of everything else. No drop. Validate here first.
#   drop = same ACCEPT + LOG, then DROP the remainder.
# ALWAYS run `log` first, read the would-be-drops with `swatter origin-lock
# preflight`, and allowlist every legit source (monitoring, grey-cloud vhosts,
# health checks) BEFORE setting `drop`. `drop` is guarded: `apply` runs preflight
# and requires interactive confirmation (or --yes/--force) before installing it.
# An empty/missing/too-small CLOUDFLARE_IPS_FILE => no rules installed (fail-open).
ORIGIN_LOCK="off"                       # off | log | drop
# Web ports the lock governs (comma-separated). Default 443 only: include :80
# ONLY if you do not rely on ACME HTTP-01 / cPanel AutoSSL DCV (or you validate
# via DNS-01). Locking :80 drops the validators' handshakes, and no carve-out
# can fix that — a payload match cannot admit a new connection, and validator
# source IPs are deliberately unpublishable. With "443" the content stays
# locked while :80 (redirects + challenges only) remains reachable for
# renewals; `apply` warns whenever 80 is listed.
ORIGIN_LOCK_PORTS="443"
# ORIGIN_LOCK_ALLOW_ACME is RETIRED and ignored: the /.well-known/ xt_string
# accept it emitted could never match a new connection's handshake (proven dead
# in production — counter 0 while Let's Encrypt validators were SYN-dropped).
# Teardown still removes the legacy rule from boxes an older version configured.
# ipset basename for the Cloudflare-edge sets: <name>4 (v4) / <name>6 (v6).
# Independent of the swatter4/swatter6 offender sets used by DIRECT_BACKEND.
ORIGIN_LOCK_SET="cf_origin"

# ---- real-time alerting (all channels optional) ---------------------------
# Swatter runs fine with no alerting config. Add only the channels you want.
# Keys go in root-only (0600) files on the server — never committed to the repo.

# SendGrid transactional email alert (needs curl + jq; set REPORT_METHOD for the
# nightly digest; this is for threshold-crossing real-time pings).
ALERT_EMAIL=""                           # recipient address; "" disables email alerts
# SENDGRID_KEY_FILE is shared with the report mailer — set it once in the
# REPORT_METHOD/SENDGRID_KEY_FILE block above.

# Twilio SMS alert. Get credentials at console.twilio.com (free trial available).
ALERT_SMS_TO=""                          # E.164 destination, e.g. +12065551234
TWILIO_SID=""                            # Account SID from the Twilio console
TWILIO_FROM=""                           # Twilio number, e.g. +15005550006
TWILIO_TOKEN_FILE=""                     # root-only file containing the Auth Token

# Generic webhook (Slack incoming webhook, Discord, PagerDuty, etc.).
# Sign up at slack.com/apps → Incoming Webhooks, or discord.com → Integrations.
ALERT_WEBHOOK_URL=""                     # full HTTPS URL; "" disables
ALERT_WEBHOOK_FORMAT="auto"             # auto | slack | discord | raw-json

# Suppress repeat alerts for the same IP for this many seconds.
ALERT_REPEAT_TTL=21600                  # 6 hours

# ---- outbound AbuseIPDB reporting (opt-in) --------------------------------
# When true, each permanent ban is reported back to AbuseIPDB (reuses
# ABUSEIPDB_KEY; set that above). Off by default — opt in deliberately.
ABUSEIPDB_REPORT="false"
ABUSEIPDB_REPORT_TTL=900               # dedupe window: don't re-report same IP within N seconds
ABUSEIPDB_REPORT_MIN_ACTION="perm"     # report only high-confidence perm bans (not
                                       # first-seen temps / swarm-corroborated temps);
                                       # set "temp" to also report temps

# ---------------------------------------------------------------------------
# Swarm — share confirmed offenders across YOUR fleet via a self-hosted hub
# (Cloudflare Worker + D1; see hub/README.md). Everything below is inert until
# SWARM_ENABLE="true" AND SWARM_HUB_URL is set AND the box is enrolled once
# with: swatter swarm enroll   (operator-run, needs the enroll token file).
#
# To CONSUME the fleet feed (boost/corroborated-block) you must ALSO add
# `swarm` to INTEL_PROVIDERS, e.g.:
#   INTEL_PROVIDERS="ipsum spamhaus abuseipdb greynoise projecthoneypot swarm"
# Publishing works without that; consuming does not.
# ---------------------------------------------------------------------------
# SWARM_ENABLE="false"
# SWARM_HUB_URL=""                                     # your own hub, e.g. https://swarm.your-domain.com
# SWARM_WRITE_TOKEN_FILE="/etc/swatter/swarm.write.token"   # 0400; LEGACY shared write token (used only until this box enrolls + gets a per-host token)
# SWARM_READ_TOKEN_FILE="/etc/swatter/swarm.read.token"     # 0400; consume (GET /feed)
# SWARM_ENROLL_TOKEN_FILE=""                           # 0400; operator-held, ONLY on the box running `swatter swarm enroll`
# SWARM_HOST_TOKEN_FILE=""                             # per-host write token, issued by the hub at enroll + stored 0600 here (default: STATE_DIR/swarm.host_token). Preferred over the shared write token; binds this box's writes to its own identity.
# SWARM_PUBLISH="true"                                 # contribute this box's confirmed perm bans
# SWARM_ACTION="boost"                                 # boost | corroborated-block
# SWARM_MIN_CORROBORATION="2"                          # distinct hosts required for a proactive block
# SWARM_BASE_SCORE="70"                                # intel score for a 1-host swarm hit (scales +15/extra host, cap 100)
# SWARM_ALLOW_FILE="/etc/swatter/swarm.allow.cidr"     # fleet canary: never published, never swarm-acted
# SWARM_MAX_AGE_DAYS="3"                               # stale swarm feed => signal ignored + warn
