name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install gawk + shellcheck
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq gawk shellcheck
          # Print the awk identity: lib/errors.sh validates the fatal-scanner
          # regexes with the same awk that applies them, and awks disagree about
          # which patterns are legal — so when this plane misbehaves, the awk
          # build is the first thing you want in the log.
          awk --version | head -1
      - name: Shellcheck (error severity)
        run: shellcheck --severity=error bin/swatter lib/*.sh lib/providers/*.sh install/*.sh test/*.sh
      - name: Full test suite
        run: make test

  hub:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: hub
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: hub/package-lock.json
      - name: Install hub dependencies
        run: npm ci
      - name: Hub test suite (vitest + workerd)
        run: npm test
