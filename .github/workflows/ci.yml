name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install gawk + shellcheck
        run: sudo apt-get update -qq && sudo apt-get install -y -qq gawk shellcheck
      - name: Shellcheck (error severity)
        run: shellcheck --severity=error bin/swatter lib/*.sh install/*.sh test/*.sh
      - name: Score pipeline tests
        run: bash test/score_test.sh
