# Gitleaks config — extends the default ruleset. The allowlists below are
# audited false positives (reviewed 2026-06-12), not real secrets; anything
# new still fails CI.
[extend]
useDefault = true

[[allowlists]]
description = "Audited false positives (apps/swatter): empty credential placeholders"
regexTarget = "line"
# Empty-string credential assignments (KEY/TOKEN/SID/SECRET/PASSWORD = "") in the
# example config and design docs. An empty value is categorically not a secret;
# a pasted NON-empty key/token still trips (the value must be "" to match here).
# Covers ABUSEIPDB_KEY, GREYNOISE_KEY, HTTPBL_KEY, BREVO_API_KEY, TWILIO_SID, etc.
regexes = ['''[A-Z0-9_]*(?:KEY|TOKEN|SID|SECRET|PASSWORD)\s*=\s*""''']
